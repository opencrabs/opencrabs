# A line that OPENS with an intent, for the stuck-loop counters.
line_start_re = '(?m)^[\s\-*•>]*(?:(?:好|现在|現在|接下来|接下來|首先)[，,]?\s*)?(?:我们|我們|我)?(?:会|會|要|将|將|来|來|需要|应该|應該|打算|正在)'

# Brief present-continuous announcement closed by an imminence marker:
# "正在检查配置文件…". Chinese has no gerund, so this arm and the intent
# families carry what the English gerund arm catches.
work_announcement_re = '(?m)^[\s\-*•>]*(?:(?:好|好的|现在|現在|正在|接下来|接下來)[，,]?\s*)?(?:我)?(?:开始|開始|继续|繼續)?(?:检查|檢查|查看|修复|修復|更新|修改|创建|創建|写入|寫入|读取|讀取|运行|運行|测试|測試|构建|構建|提交|推送|合并|合併|部署|清理|安装|安裝|编译|編譯|验证|驗證|搜索|扫描|掃描|分析|加载|加載|下载|下載|上传|上傳|删除|刪除|添加|配置|重构|重構|生成|打开|打開|关闭|關閉|复制|複製|移动|移動|回滚|回滾|排查|定位|记录|記錄|整理|保存|执行|執行)[^。！？\n]{0,40}?(?:现在|現在|\.{3}|…|：\s*(?:\n|$))'

# An intent line that ends in a colon (full-width or ASCII), i.e. a list is
# about to follow.
trailing_colon_re = '(?m)^[\s\-*]*(?:我)?(?:会|會|要|将|將|来|來|需要|现在|現在)?(?:检查|檢查|查看|修复|修復|更新|修改|创建|創建|运行|運行|测试|測試|构建|構建|部署|清理|安装|安裝|验证|驗證|搜索|扫描|掃描|分析|删除|刪除|添加|配置|重构|重構|生成|保存|执行|執行)[^：:\n]{0,40}[：:]\s*$'

# Line-start future or obligation, counted for the multi-step-plan arm.
now_imperative_re = '(?m)^[\s\-*]*(?:现在|現在|接下来|接下來|首先)?(?:我)?(?:会|會|要|将|將|来|來|需要|应该|應該)'

# A numbered step that opens with an action verb.
numbered_steps_re = '(?m)^\s*\d+[.、)]\s*(?:检查|檢查|修复|修復|更新|修改|创建|創建|写入|寫入|读取|讀取|运行|運行|测试|測試|构建|構建|提交|推送|合并|合併|部署|清理|安装|安裝|验证|驗證|删除|刪除|添加|配置|重构|重構|生成|保存|执行|執行)'

# A standalone past-tense sentence: the shape of completed-work narration.
past_tense_standalone_re = '(?m)^[\s\-*]*(?:已|已经|已經)?(?:检查|檢查|修复|修復|更新|修改|创建|創建|写入|寫入|读取|讀取|运行|運行|测试|測試|构建|構建|提交|推送|合并|合併|部署|清理|安装|安裝|编译|編譯|验证|驗證|删除|刪除|添加|配置|重構|重构|生成|保存|执行|執行)[^。！？\n]{0,20}[。！.]'

