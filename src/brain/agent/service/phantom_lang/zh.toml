# Chinese phantom-detection configuration
#
# Covers BOTH script variants: every phrase is listed in Simplified and in
# Traditional, built from one stem pair each so the two spellings cannot drift.
# A reply is written in whichever the user's locale uses, and a pack that
# carried only one would miss the other entirely.
#
# Chinese does not separate words with spaces, which is why `action_verbs` and
# `generic_intent_re` are empty below: the past-tense claim check compares
# whitespace-delimited words one at a time, so no single verb could ever match
# inside a Chinese sentence. The perfective claims live in `completion_claims`,
# which is a substring scan and reads them fine.

# First-person work announcements: prefix families (wo, wo hui, wo yao,
# rang wo, xianzai, zhengzai) crossed with verb stems, plus the set
# phrases a speaker uses instead of a family.
