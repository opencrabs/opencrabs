# A line that OPENS with an intent, for the stuck-loop counters. The
# future prefix attaches (sa- / sa-na-), which is why it is its own branch.
line_start_re = '(?m)^[\s\-*•>]*(?:(?:الآن\s+)?(?:دعني|دعنا|سوف|يجب\s+أن|علي\s+أن|علينا\s+أن|أحتاج\s+أن|أريد\s+أن)\s+\S|(?:الآن\s+)?س[أن]\S)'

# Brief present-continuous announcement closed by an imminence marker:
# "أفحص الملفات الآن." The verb prefix is optional because the stem carries
# the meaning once the person marker is read.
work_announcement_re = '(?i)^[\s\-*•>]*(?:الآن\s+|حسنا\s+|طيب\s+)?(?:سأ|سن|سوف\s+|دعني\s+|دعنا\s+|أنا\s+|نحن\s+)?(?:أ|ن)?(?:فحص|راجع|تحقق|عدل|صلح|نشئ|كتب|قرأ|شغل|بحث|نشر|رفع|رسل|حفظ|ثبت|ختبر|نظف|دمج|نجز|كمل|غلق|فتح|نسخ|نقل|لغ|حدث|طبق|ستبدل|لخص|بني|مرر|صحح|وثق|شخص|حلل|راقب|ضبط|وسع|حمل|نزل|جرب|وقف|عالج|رتب|ضيف|حذف|سجل|ختار)\S*[^.!?:\n]{0,60}?(?:\s+الآن(?:[.!…,:]+|\s*(?:\n|$))|\.{3}|…|:\s*(?:\n|$))'

# An intent line that ends in a colon, i.e. a list is about to follow.
trailing_colon_re = '(?im)(?:^|\n)\s*(?:سأ|سن|سوف|دعني|دعنا|يجب\s+أن)\S*[^:\n]{0,80}:\s*$'

# Line-start imperative or future, counted for the multi-step-plan arm.
now_imperative_re = '(?m)^[\s\-*]*(?:الآن\s+)?(?:دعني|دعنا|سوف|سأ|سن|يجب\s+أن|علي\s+أن)\s*\S'

# A numbered step that opens with an action noun.
numbered_steps_re = '(?m)^\s*\d+[.)]\s*(?:فحص|مراجعة|تحديث|إصلاح|إنشاء|كتابة|قراءة|تشغيل|بحث|حذف|إضافة|تعديل|اختبار|نشر|دمج|تثبيت|تنظيف|رفع)'

# A standalone past-tense sentence: the shape of completed-work narration.
past_tense_standalone_re = '(?m)^[\s\-*]*(?:فحصت|راجعت|تحققت|عدلت|أصلحت|أنشأت|كتبت|قرأت|شغلت|بحثت|نشرت|رفعت|أرسلت|حفظت|ثبتت|اختبرت|نظفت|دمجت|أنجزت|أكملت|أغلقت|فتحت|نسخت|نقلت|ألغيت|أعدت|حدثت|طبقت|استبدلت|لخصت|بنيت|مررت)[.!]'

# Arabic has no gerund, so the gerund arm has no equivalent: the
# present-continuous narration it catches in English is carried here by
# the intent families above ("الآن أفحص", "أنا أفحص") and by
# work_announcement_re, which wants the same imminence marker.
gerund_re = ''

