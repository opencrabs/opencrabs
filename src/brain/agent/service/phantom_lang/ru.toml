line_start_re = "(?im)^[\\s\\-*•>]*(?:(?:ладно|хорошо|ну|ок|окей|так)\\s*,?\\s+)?(?:сейчас|теперь)?(?:давайте|давай|я|мне нужно|мне надо|я должен|я должна|мне следует|нужно)\\s+\\w"

# Объявление о выполняемой работе, завершающее ход без вызова инструмента —
# «Сейчас запускаю проверки.», «Запускаю проверки сейчас.». Русский использует
# настоящее время 1-го лица, поэтому требуем «сейчас/теперь» в начале или в
# конце (или … / : ) — это и есть маркер немедленности.
work_announcement_re = "(?i)^[\\s\\-*•>]*(?:(?:(?:а\\s+)?затем|(?:а\\s+)?потом|далее|и)[,]?\\s+)?(?:(?:ладно|хорошо|ну|ок|окей|так)[,.!:]?\\s+)?(?:(?:сейчас|теперь)\\s+(?:запускаю|перезапускаю|проверяю|собираю|тестирую|обновляю|исправляю|читаю|пишу|создаю|генерирую|ищу|устанавливаю|компилирую|анализирую|исследую|загружаю|скачиваю|удаляю|применяю|разворачиваю)\\b[^.!?:\\n]{0,60}|(?:запускаю|перезапускаю|проверяю|собираю|тестирую|обновляю|исправляю|читаю|пишу|создаю|генерирую|ищу|устанавливаю|компилирую|анализирую|исследую|загружаю|скачиваю|удаляю|применяю|разворачиваю)\\b[^.!?:\\n]{0,40}?\\s+(?:сейчас|теперь))(?:[.!…,:]+|\\s*(?:\\n|$))"
# Gerund-led plan announcement carrying NO imminence marker — "Setting up the
# plan, then mapping every call site before touching anything." Two reasons
# the patterns above cannot see it (#1261): the verb is a PREPARATION verb
# (mapping, planning, drafting, listing) that work_announcement_re never
# enumerated, and the clause is sequenced with then / before instead of ending
# in now / … / :, which that pattern requires and gerund_re expects at the
# front. Scanned by the zero-tool gate only: once a tool has run, the same
# shape can be a legitimate recap ("Updating the config fixed it, then the
# build passed").
plan_announcement_re = "(?im)^[\\s\\-*•>]*(?:(?:ок|хорошо|ладно)[,.!:]?\\s+)?(?:сейчас\\s+|сначала\\s+)?(?:настраиваю|составляю|планирую|готовлю|размечаю|собираю|проверяю|читаю|анализирую|исследую|создаю|обновляю|запускаю|документирую)\\b[^.!?\\n]{0,120}?\\b(?:затем|потом|далее|прежде\\s+чем|после\\s+этого)\\b"


gerund_re = "(?im)(?:^|[.!?]\\s+)\\s*(?:сейчас|теперь)\\s+(?:обновляю|исправляю|создаю|изменяю|добавляю|удаляю|запускаю|читаю|ищу|изучаю|проверяю)\\b"

trailing_colon_re = "(?im)(?:^|\\n)\\s*(?:давайте|давай|я|сейчас)\\s+\\w[^:\\n]{0,80}:\\s*$"

now_imperative_re = "(?m)^[\\s\\-*]*(?:сейчас|теперь)\\s+(?:давайте|давай|я)?\\s+\\w"

numbered_steps_re = "(?m)^\\s*\\d+\\.\\s+(?:обновить|исправить|создать|изменить|добавить|удалить|проверить|прочитать|запустить)"

past_tense_standalone_re = "(?m)^[\\s\\-*]*(?:обновил|исправил|создал|изменил|добавил|удалил|запустил|прочитал|нашёл|изучил|запушил|задеплоил|смерджил|закоммитил)[.!]"

path_re = "(?:^|[\\s`(])(?:\\./)?[a-zA-Zа-яА-Я_][\\w\\-]*/[\\w\\-/]*\\.\\w{1,6}(?:[\\s`),:;]|$)"

