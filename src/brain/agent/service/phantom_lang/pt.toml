# ── Marcador-less: participle com pronome objecto próprio (#1694) ──────────
# "Lendo-os com atenção, anoto as discrepâncias." anuncia trabalho sem nenhum
# marcador de iminência nem de sequência, por isso escapa às três armas
# existentes. O clítico português é ENCLÍTICO atrás de hífen, daí `[-\s]?`
# e o sufixo `-endo` a partir de {1,}: "Lendo" = `l` + `endo`, portanto {2,}
# nunca casaria. O grupo 1 é o resto da oração ([^.!?\n]*).
participle_object_re = "(?i)^[\\s\\-*•>]*[a-záéíóúâêôãõçú]{1,}(?:ando|endo)[-\\s]?(?:os|as|o|a|nos|lhes)\\b(?:\\s+[a-záéíóúâêôãõçú]+mente)?([^.!?\\n]*)"

