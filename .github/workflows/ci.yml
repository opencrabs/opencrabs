name: CI

# Trigger model (single-maintainer OSS, GitHub Flow):
#   - pull_request: full gate on contributions — required to review
#     external PRs safely.
#   - push to main: catch direct pushes and keep main provably green.
#     Docs-only commits are skipped via paths-ignore so they don't burn
#     the matrix; rapid pushes cancel older runs via `concurrency`. The
#     heavy cross-platform BUILD job is gated off routine main pushes
#     (see its `if:`) so a normal commit only pays for lint + the two
#     test legs (macOS self-hosted, Linux hosted) + audit. This replaces
#     the old
#     opt-out `[skip ci]`-on-every-commit toil with sensible defaults.
#   - workflow_dispatch: run the build matrix on demand (e.g. to verify
#     macOS before cutting a release tag; Windows is validated by release.yml).
# CI deliberately does NOT run on tags — the release workflow owns tags
# and trusts the commit already passed CI on its way to main. That also
# kills the old double-build where ci.yml and release.yml both compiled
# Windows/macOS on the same tag event.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ── Stage 1: Lint (fast gate — fails early before burning compute) ────────
  # Pattern lifted from ZeroClaw: run fmt + clippy first. If either fails,
  # every downstream job is skipped. Avoids burning ~25 min on the
  # cross-platform build/test matrix for a PR that won't lint anyway.
  lint:
    name: Lint
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    # 25: hosted Lint ran 13:43 of its 15 cap on a fork PR (run
    # 36069934718); one noisy neighbor on the hosted fleet is a false red.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Refuse to administer the host's rustup
        # dtolnay/rust-toolchain manages rustup on whatever machine it runs
        # on, and defaults CARGO_HOME to ~/.cargo when it is unset. On a
        # self-hosted runner that is somebody's workstation, so CI installs
        # toolchains into their installation: it removed the rustup binary
        # itself once, leaving every shim in ~/.cargo/bin dangling and no
        # working cargo for the machine owner (#1162).
        #
        # The runner sets CARGO_HOME and RUSTUP_HOME to its own directories.
        # This fails the job if that ever stops being true, rather than
        # letting the damage be discovered at the owner's next build.
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          for var in CARGO_HOME RUSTUP_HOME; do
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::error::$var is unset, so rustup would manage the host's own installation. Set it in the runner service environment."
              exit 1
            fi
            case "$value" in
              "$HOME/.cargo"|"$HOME/.rustup")
                echo "::error::$var points at the host's own installation ($value). CI must not administer it."
                exit 1
                ;;
            esac
            echo "$var=$value"
          done

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install ALSA dev (for local-stt feature)
        # Linux-only: ALSA does not exist on macOS, where cpal uses CoreAudio.
        # Left ungated, this ran `apt-get` on the self-hosted Mac and failed on
        # sudo before any Rust work started.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev

      - name: Check formatting
        # Soft-fail: legacy un-formatted code blocks shouldn't block PRs
        # yet. Promote to hard-fail once a fmt sweep lands on main.
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Byte-slice ratchet self-test
        # A checker that has silently learned to find nothing is worse than no
        # checker, so it ships its own teeth (#2221).
        run: python3 scripts/check-byte-slice-ratchet.py --self-test

      - name: Clippy, with the byte-slice ratchet
        # One clippy run does both jobs. -D warnings is still the gate for every
        # other lint; clippy::string_slice is held at warn by --force-warn (a
        # group -D beats a later -W, measured) so the ratchet can read the site
        # list instead of dying on the 900 sites this repo already has. Only a
        # site that is not in scripts/byte-slice-baseline.txt fails the job.
        #
        # The touch matters: on a restored cargo cache every unit reports fresh
        # and clippy emits no diagnostics at all, which would let the ratchet
        # pass without checking anything. Forcing our own crate to recompile
        # keeps dependencies cached and keeps the check real.
        run: |
          touch src/lib.rs
          python3 scripts/check-byte-slice-ratchet.py

  # ── Stage 2: Build verification (parallel, gated on lint + audit) ────────
  # Cross-platform BUILD on macOS confirms target compatibility without
  # running tests there (tests run on Linux only — see `test` below).
  # Windows is not built here (#627) — it chronically hit the 40m cap and
  # release.yml already validates it at tag time. Most of our test surface
  # is platform-independent; if a macOS-specific test ever regresses we can
  # promote it via the matrix.
  build:
    name: Build (${{ matrix.target }})
    needs: [lint, audit]
    # Cross-platform build verification. Runs where it pays off — on PRs
    # (gate contributions) and on-demand (workflow_dispatch, e.g. before a
    # release tag) — but NOT on every routine push to main. Direct main
    # pushes still get lint + both test legs + audit.
    #
    # Windows is intentionally NOT built here (#627): it builds --all-features
    # with rust-cache skipped (always cold), so it chronically hit the 40m cap
    # and blocked otherwise-green PRs. It is build-only (no tests) and
    # release.yml's build-release matrix already builds + validates Windows
    # before any tag is published, so a platform regression cannot reach a
    # release unnoticed.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: self-hosted
            target: aarch64-apple-darwin
            features: --all-features
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Refuse to administer the host's rustup
        # dtolnay/rust-toolchain manages rustup on whatever machine it runs
        # on, and defaults CARGO_HOME to ~/.cargo when it is unset. On a
        # self-hosted runner that is somebody's workstation, so CI installs
        # toolchains into their installation: it removed the rustup binary
        # itself once, leaving every shim in ~/.cargo/bin dangling and no
        # working cargo for the machine owner (#1162).
        #
        # The runner sets CARGO_HOME and RUSTUP_HOME to its own directories.
        # This fails the job if that ever stops being true, rather than
        # letting the damage be discovered at the owner's next build.
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          for var in CARGO_HOME RUSTUP_HOME; do
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::error::$var is unset, so rustup would manage the host's own installation. Set it in the runner service environment."
              exit 1
            fi
            case "$value" in
              "$HOME/.cargo"|"$HOME/.rustup")
                echo "::error::$var points at the host's own installation ($value). CI must not administer it."
                exit 1
                ;;
            esac
            echo "$var=$value"
          done

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (macOS)
        env:
          CFLAGS: -march=armv8-a+crypto
          CXXFLAGS: -march=armv8-a+crypto
        run: cargo build --locked --profile ci --target ${{ matrix.target }} ${{ matrix.features }}

  # ── Stage 2a2: Windows path filter (decides whether Stage 2b runs) ────────
  # Path filter, fail-open. A 51-minute GitHub-hosted build on every push
  # to every PR is the cost that got the original job deleted (#627), and
  # most PRs here cannot break Windows. Fire on the paths that have
  # actually produced Windows-only breakage: the dependency graph and
  # toolchain, the platform abstraction, the spawn and read paths, and
  # this workflow itself. Anything we cannot determine builds anyway, and
  # a `windows` label forces a build for the cases this list misses.
  # Deliberate gap: a new cfg(windows) block in an unlisted file is not
  # caught here. release.yml's matrix still builds Windows before any tag
  # ships, which is the coverage #627 relied on; Stage 2b only moves that
  # signal earlier for the paths where it pays for itself.
  #
  # Its own job rather than a step inside Stage 2b (#1831). A step-level
  # `if:` skips the steps but the job still concludes success, so the merge
  # box and `gh pr checks` rendered "Build (windows): pass" on a run that
  # had compiled nothing. A job-level gate on this output is the only shape
  # that renders the honest "skipped". Hosted Linux because it is a clone
  # plus a grep: no toolchain, no cache, seconds.
  windows-filter:
    name: Windows path filter
    # Carries the event gate Stage 2b used to own. On a main push neither
    # job is evaluated, so a routine commit still pays for lint + test +
    # audit only.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.relevant.outputs.run }}
    steps:
      # fetch-depth 0: the filter below diffs against the PR base sha.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Windows-relevant changes?
        id: relevant
        shell: bash
        run: |
          set -u
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "not a pull_request, building"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'windows') }}" == "true" ]]; then
            echo "windows label present, building"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base sha ${base} not in this clone, building (fail open)"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "changed files:"
          echo "$files"
          # The last two paths are #1823: the files whose tests assert
          # Windows behaviour, so the runtime lane fires when they change.
          # src/cli/service_windows.rs is deliberately NOT listed: that
          # carrier belongs to #1821 and does not exist on this tree yet, so
          # listing it would be a promise this repo cannot keep. Add it in
          # the PR that adds the file.
          pattern='^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|build\.rs|\.github/workflows/ci\.yml|src/utils/(shell|cwd)\.rs|src/brain/tools/(bash|read)\.rs|src/tui/app/input\.rs|src/config/(winlock|profile)\.rs)$'
          if echo "$files" | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no Windows-relevant paths touched, skipping the build"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Stage 2b: Windows build (gated on lint, audit, path filter) ─────────
  # Windows is where platform-specific regressions actually ship: the `sh -c`
  # hardcode in four child-spawn sites lived for months with CI green,
  # because tests run on Linux (where `sh` exists) and Windows was never
  # built here (#627 — the old job chronically hit the 40m cap with
  # --all-features and cold caches). It catches spawn-path and cfg(windows)
  # compile breakage at PR time, and since #1823 it also EXECUTES the binary
  # it built: the --version smoke step below is the first signal in this
  # repo's history that opencrabs.exe actually starts, because compile-green
  # was never starts-green (#1759). Still no full test suite: the ci-gate job
  # comment carries the #627 cost history behind that decision. The
  # release recipe (CMake + NASM) compiles the llama-cpp-sys-2 C++ wrapper;
  # `--profile ci` (thin LTO, 16 codegen units) plus rust-cache keep the
  # wall-clock inside the cap that killed the original job.
  windows-build:
    name: Build (windows)
    needs: [lint, audit, windows-filter]
    # Job-level, not step-level (#1831): when the filter says no, GitHub
    # concludes this job skipped. A needed job that was skipped or failed
    # also lands here, since outputs.run stays empty.
    if: needs.windows-filter.outputs.run == 'true'
    runs-on: windows-latest
    # 60 min: a COLD windows-latest run needs ~48 (33 compile incl. llama's
    # cmake C++ + ~15 for the thin-LTO link of a 4-vCPU runner); warm runs
    # from rust-cache land near 10. The original 40 cap killed a build that
    # was minutes from linking. Keep a cap so a true hang can't burn 360.
    # 90 (not 60) while the scoped-test step rides along: the cfg(test) lib
    # compiles on top of the build. The job is NOT in the required gate, so
    # the extra ceiling is a priced trade for the first-ever Windows
    # execution receipts, not silent drift.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      # No `save-if` restriction: this job only runs on PRs and
      # workflow_dispatch, so a `refs/heads/main`-only save-if never fires —
      # the cache would stay cold forever. Saving in the run's own scope
      # lets the 2nd..Nth push of a PR hit warm artifacts.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      # Pinned to a released tag and an explicit tool version: the action
      # defaults cmakeVersion to "latest" and resolves it at run time.
      - name: Install CMake (Windows)
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.4"

      - name: Install NASM (Windows)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Build
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: '1'
        # NOTE: local DEBUG-profile Windows builds hit LNK2038: esaxx-rs
        # 0.1.10's default `cpp` feature compiles /MT (build.rs
        # .static_crt(true)) while cmake-rs injects "-MD" into
        # CMAKE_C/CXX_FLAGS (it skips that injection only when the build
        # script already defines those vars). RUSTFLAGS
        # crt-static does NOT fix this — it flips the cc crates but never
        # reaches cmake-rs. Verified workaround for local debug builds
        # (llama-cpp-sys-2 forwards every CMAKE_* env var as a -D define):
        #   CMAKE_C_FLAGS=/O2 /DNDEBUG /Ob2 -nologo -MT -Brepro -W0
        #   CMAKE_CXX_FLAGS=/O2 /DNDEBUG /Ob2 -nologo -MT -Brepro -W0
        #   CMAKE_C_FLAGS_RELEASE=... (same, VS generator reads these)
        #   CMAKE_CXX_FLAGS_RELEASE=... (same)
        # This job uses the release-shaped profile, where the linker
        # doesn't pull the esaxx object — the shape that ships releases.
        run: cargo build --locked --profile ci --target x86_64-pc-windows-msvc --all-features

      # No step-level `if:` on either step below, deliberately. This job is
      # gated at job level on needs.windows-filter.outputs.run (#1831) and
      # has no `steps.relevant` context: the fork this is harvested from
      # keeps the filter as a step inside this job, where that expression
      # does resolve. Copied verbatim, both steps would evaluate falsy, be
      # skipped, and the job would still conclude success, which is the
      # exact fake-green shape #1855 removed from this file.
      - name: "Smoke (windows): execute the binary it built"
        shell: bash
        run: |
          # Actions' bash runs with -e: without the guard, a failing exe
          # would die AT the substitution and the echo below would never
          # run, which is precisely the case whose diagnostic we want.
          # stderr rides in too (DLL-load failures land there).
          set +e
          ver=$(./target/x86_64-pc-windows-msvc/ci/opencrabs.exe --version 2>&1)
          status=$?
          set -e
          echo "exit=$status version=$ver"
          [ "$status" -eq 0 ] || exit 1
          echo "$ver" | grep -qi opencrabs

      # Scoped execution: only the modules whose tests assert platform
      # behaviour. Full-suite Windows was rejected twice (#627 cost, and
      # POSIX-semantics failures that are not bugs). Every member below
      # exists on this tree, so Windows gives real receipts on day 1 instead
      # of a zero-match tripwire:
      #   config::winlock                     3 tests, cross-handle
      #                                       contention and fail-closed
      #                                       terminate proof, cfg(windows):
      #                                       these run nowhere else
      #   tests::utils_shell_test            12 tests, the shell_pair probe
      #                                       contract
      #   tests::utils_cwd_test               5 tests, drive-letter and
      #                                       lookalike dirs
      #   tests::browser_default_windows_test  6 tests, browser path
      #                                       detection
      #   tests::profile_test                67 tests, lock-owner stamp
      #                                       parsing and reused-PID
      #                                       resolution. The round-9
      #                                       finding (a Windows-only test
      #                                       failure) lived in exactly this
      #                                       module, and no CI job could
      #                                       have seen it: Windows ran no
      #                                       tests.
      # cli::service_windows is NOT in the slice yet: its carrier belongs to
      # #1821 and does not exist here, so listing it would make this step
      # permanently red on a zero-match and defeat the flip noted below.
      # continue-on-error: true is the honest day-1 state, not a dodge: 93
      # tests here have never executed on Windows in this repo's history, so
      # their outcome is unknown and must not block a PR. The smoke step
      # above is NOT soft, because a binary that does not start is a hard
      # fail. Flip continue-on-error to false once the receipts are green,
      # in the PR that reports them.
      - name: "Scoped tests (windows): platform-behaviour slice"
        continue-on-error: true
        shell: bash
        run: |
          # One filter per module, each individually judged. A combined
          # `cargo test -- a b c` that silently matches nothing looks green;
          # per-module zero-detection here is a SCREAM (a module renamed by a
          # sibling PR), not a pass, the same anti-fake-green principle the
          # footgun gate's --self-test enforces.
          # Actions' bash runs with -e, so an unguarded substitution exits AT
          # the assignment and `rc=$?` below is never reached: the loop would
          # abort on the first failing module, print none of the captured
          # output, and skip every module after it. The smoke step carries
          # the same guard for the same reason. One more trap: with `--lib`,
          # cargo writes "test result: FAILED. N passed" on failure, so
          # parsing $out must not assume the ok-form.
          status=0
          for m in config::winlock tests::utils_shell_test \
                   tests::utils_cwd_test tests::browser_default_windows_test \
                   tests::profile_test; do
            set +e
            out=$(cargo test --locked --profile ci --target x86_64-pc-windows-msvc \
                    --lib -- "$m" 2>&1)
            rc=$?
            set -e
            n=$(printf '%s\n' "$out" | sed -n 's/^test result: [a-z]*\. \([0-9]*\) passed.*/\1/p' | head -n1)
            failed=$(printf '%s\n' "$out" | sed -n 's/.*; \([0-9]*\) failed.*/\1/p' | head -n1)
            if [ $rc -ne 0 ]; then
              echo "::warning::Windows slice FAILS (rc=$rc, failed=${failed:-?}): $m"
              printf '%s\n' "$out" | tail -20
              status=1
            elif [ -z "$n" ] || [ "$n" -eq 0 ]; then
              echo "::warning::Windows slice ZERO-MATCH: $m names no tests here (renamed by a sibling PR)"
              status=1
            else
              echo "Windows slice PASS: $m ($n tests)"
            fi
          done
          exit $status

  # ── Windows footgun gate (static, cheap, blocks the merge) ─────────────
  # The only python step in this workflow, and deliberately not part of the
  # Windows build lane: it scans source text, so it costs seconds instead
  # of the 51m09s that keeps windows-build out of the required gate below.
  # A footgun finding blocks the PR rather than scrolling by as advisory,
  # which is the whole point of running it on every push.
  #
  # `--self-test` runs FIRST and on its own line: it plants every rule and
  # every cfg shape, so a linter regression fails here instead of turning
  # the scan green by matching nothing. That is the difference between a
  # gate and decoration.
  windows-footguns:
    name: Windows footguns
    timeout-minutes: 10
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Linter proves its own teeth
        run: python3 scripts/check-windows-footguns.py --self-test

      - name: Scan the tree
        run: python3 scripts/check-windows-footguns.py --root src

  # ── Stage 3: Test (gated on lint + audit, parallel with build) ──
  # Two legs, one per platform. Both call .github/workflows/test-suite.yml so
  # the command, the stall watchdog and the toolchain install exist once; the
  # platform differences are conditions inside that file.
  #
  # Why two legs: the only self-hosted runner on this repo is macOS (mac-studio),
  # so before #2216 our own PRs and every push to main were tested on macOS and
  # nowhere else. Linux was exercised only by fork PRs, whose branch of the
  # runner expression sends them to a hosted runner. A Linux-only break therefore
  # shipped green, which is how the v0.5.13 linux-amd64 asset went out built for
  # glibc 2.43 with nothing in this workflow having run the suite on Linux.
  #
  # `Test` keeps its name: the main-protection ruleset requires that exact
  # status context, so renaming it would leave the required check permanently
  # absent and unblock every PR.
  #
  # Stays on `cargo test` for now: a few timing-sensitive tests
  # (rate_limiter pacing) rely on cargo test's threadpool semantics
  # and fail under nextest's process-per-test isolation. nextest
  # migration is a follow-up once those tests are made portable.
  test:
    name: Test
    needs: [lint, audit]
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    # 60: fork PRs run this on hosted runners at roughly 3x self-hosted
    # speed, and the 30 cap killed cold-cache fork runs twice (runs
    # 36078125556 and 36069934718, both cancelled at ~30 while green code
    # waited). Warm hosted fits in 20; 60 is the cold-cache ceiling.
    timeout-minutes: 60
    steps: &test-steps
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Refuse to administer the host's rustup
        # dtolnay/rust-toolchain manages rustup on whatever machine it runs
        # on, and defaults CARGO_HOME to ~/.cargo when it is unset. On a
        # self-hosted runner that is somebody's workstation, so CI installs
        # toolchains into their installation: it removed the rustup binary
        # itself once, leaving every shim in ~/.cargo/bin dangling and no
        # working cargo for the machine owner (#1162).
        #
        # The runner sets CARGO_HOME and RUSTUP_HOME to its own directories.
        # This fails the job if that ever stops being true, rather than
        # letting the damage be discovered at the owner's next build.
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          for var in CARGO_HOME RUSTUP_HOME; do
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::error::$var is unset, so rustup would manage the host's own installation. Set it in the runner service environment."
              exit 1
            fi
            case "$value" in
              "$HOME/.cargo"|"$HOME/.rustup")
                echo "::error::$var points at the host's own installation ($value). CI must not administer it."
                exit 1
                ;;
            esac
            echo "$var=$value"
          done

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install mold + ALSA dev (Linux)
        # Linux-only toolchain extras; macOS uses the Xcode linker.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y mold clang libasound2-dev

      - name: Run tests
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        # #1936: the suite can freeze with every test-thread slot blocked;
        # before, the job just burned timeout-minutes and died with no
        # verdict. The wrapper detects the silence, dumps thread stacks of
        # cargo and its test children, kills the tree, and fails in ~5
        # minutes instead of 60. The command it runs is unchanged.
        run: bash scripts/test-stall-watchdog.sh cargo test --locked --profile ci --all-features --verbose

  # Linux leg. The requirement is that any commit which can be tagged has at
  # least one test run on Linux (#2216). ubuntu-24.04 rather than
  # ubuntu-latest on purpose: the hosted label rolls forward, and 24.04 is the
  # image release.yml builds the Linux artifacts on (glibc floor 2.39), so the
  # suite runs where the shipped binary runs.
  #
  # The steps below are the anchor `&test-steps` defined on the `test` job above,
  # so there is exactly one copy of the suite command and it cannot drift. Two
  # mechanisms were rejected: a copied block (a drifting copy is the same bug as
  # the comment that described a Linux test that did not run), and a reusable
  # workflow (a called workflow reports its check as `caller / called`, which
  # would orphan the required `Test` context in the main-protection ruleset and
  # block every PR).
  #
  # Skipped for fork PRs: their `Test` leg already executes on ubuntu-latest,
  # so running this too would be the same Linux run twice.
  test-linux:
    name: Test (Linux)
    needs: [lint, audit]
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps: *test-steps

  # ── Stage 1b: Security (fast gate — runs alongside lint, before build/test)
  # cargo-audit only scans Cargo.lock; it needs no compile, so it runs in
  # PARALLEL with lint as a second fast gate rather than after it. build/test/
  # coverage all `needs: [lint, audit]`, so a fresh advisory (this fails in
  # ~4s) skips both test legs and the cross-platform build matrix instead of
  # racing them. Lockfile-only fix → no recompile to re-gate.

  audit:
    name: Cargo Audit
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Refuse to administer the host's rustup
        # dtolnay/rust-toolchain manages rustup on whatever machine it runs
        # on, and defaults CARGO_HOME to ~/.cargo when it is unset. On a
        # self-hosted runner that is somebody's workstation, so CI installs
        # toolchains into their installation: it removed the rustup binary
        # itself once, leaving every shim in ~/.cargo/bin dangling and no
        # working cargo for the machine owner (#1162).
        #
        # The runner sets CARGO_HOME and RUSTUP_HOME to its own directories.
        # This fails the job if that ever stops being true, rather than
        # letting the damage be discovered at the owner's next build.
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          for var in CARGO_HOME RUSTUP_HOME; do
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::error::$var is unset, so rustup would manage the host's own installation. Set it in the runner service environment."
              exit 1
            fi
            case "$value" in
              "$HOME/.cargo"|"$HOME/.rustup")
                echo "::error::$var points at the host's own installation ($value). CI must not administer it."
                exit 1
                ;;
            esac
            echo "$var=$value"
          done

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # Ignored advisories. Every one is a TRANSITIVE dependency: none is
        # declared in our Cargo.toml, so the lever is always an upstream crate,
        # never a version bump we can make here. Re-checked 2026-09-04 (#1344).
        #
        # Six of the nine trace to ONE dependency, `rwhisper` (the local-stt
        # feature), whose tree is still on reqwest 0.11 / hyper 0.14 / candle
        # 0.8. rwhisper 0.4.1 is the latest published release, so there is
        # nothing to move to. If local-stt is ever dropped or rwhisper updates,
        # most of this list goes with it.
        #
        #   RUSTSEC-2026-0258  h2 — VULNERABILITY (low, DoS): unbounded empty
        #                      DATA frames. Our direct h2 is patched (0.4.17);
        #                      the hit is h2 0.3.27 via rwhisper -> kalosm-common
        #                      -> reqwest 0.11 -> hyper 0.14. The 0.3 line has no
        #                      fixed release. We are an HTTP *client*, so the
        #                      described flood requires a hostile endpoint we are
        #                      already talking to. Drop when rwhisper moves to a
        #                      reqwest on hyper 1.x.
        #   RUSTSEC-2026-0253  lru — unsound pop() panic safety   \
        #   RUSTSEC-2026-0002  lru — unsound IterMut               | via rwhisper
        #   RUSTSEC-2025-0134  rustls-pemfile — unmaintained       | ->kalosm
        #   RUSTSEC-2025-0119  number_prefix — unmaintained        | (indicatif
        #   RUSTSEC-2024-0436  paste — unmaintained (candle/gemm)  /  -> hf-hub)
        #
        #   RUSTSEC-2025-0141  bincode — unmaintained. Two paths, both needed:
        #                      syntect's `dump-load` (how we load the bundled
        #                      syntax/theme dumps) and printpdf -> azul-layout
        #                      -> hyphenation.
        #   RUSTSEC-2026-0192  ttf-parser — unmaintained, via pdf-extract -> lopdf.
        #                      pdf-extract 0.12.0 is the latest release.
        #   RUSTSEC-2026-0173  proc-macro-error2 — unmaintained, via
        #                      teloxide -> aquamarine. teloxide 0.17.0 is latest.
        #
        # Cleared 2026-09-04, do not re-add without evidence:
        #   RUSTSEC-2024-0320  yaml-rust — gone. syntect no longer pulls it: we
        #                      only ever load the bundled binary dumps, so the
        #                      YAML syntax loader was dead weight and the feature
        #                      set was narrowed off `default-fancy`.
        #   RUSTSEC-2026-0187  lopdf — gone. printpdf 0.12.7 moved off lopdf 0.39;
        #                      the ignore had been stale.
        #   chacha20 (yanked)  gone. `cargo update` moved it 0.10.1 -> 0.10.2.
        #                      It never had an ignore: audit does not fail on
        #                      yanked, so it had been passing silently.
        #
        # The ten below are all blocked upstream: either the crate is at its
        # latest published release (checked against crates.io on 2026-10-21) or
        # the release that would fix it cannot be reached from this tree. A
        # routine `cargo update` will not shift them; only an upstream release
        # or dropping the dependency will.
        # zip (RUSTSEC-2026-0367/0368/0369, #2091, #2092): fixed in zip 9.0.0
        #   upstream, but this tree still carries a zip 8.6.0 copy, so the three
        #   ignores stay until `cargo tree -i zip@8.6.0` prints nothing. Our
        #   code only reads archives (ZipArchive::new, by_name, by_index) and
        #   never calls extract(), the path these advisories concern. Our direct
        #   zip is 9.0.4; the 8.6.0 copy is pinned by three crates, all at their
        #   newest release: calamine 0.36.1, docx-rs 0.4.22 and rust_xlsxwriter
        #   0.99.1. The third copy, zip 1.1.4, arrives through candle-core 0.8.4
        #   via rwhisper 0.4.1 (latest), which pins candle 0.8, so that one is an
        #   upstream wait too. Remove each ignore the day its blocker moves.
        # webpki-roots 0.26.11 (RUSTSEC-2026-0381): patched in >=1.0.10, and the
        #   tree now carries 1.0.10. The flagged copy is the 0.26 line, which is
        #   a semver-trick shim with no certificate data of its own: its entire
        #   library is `pub use parent::TLS_SERVER_ROOTS` over `webpki-roots
        #   ^1`, so it serves the patched 1.0.10 roots. It arrives via hf-hub
        #   0.3.2 -> ureq 2.12.1, and 2.12.1 is the last of the 2.x line, which
        #   pins webpki-roots ^0.26. hf-hub 0.5.0 would use ureq ^3 and drop the
        #   0.26 line entirely, but kalosm-common 0.4.0 (latest) pins hf-hub
        #   ^0.3.0, so that move needs kalosm to release first. Remove this
        #   ignore when `cargo tree -i webpki-roots@0.26.11` prints nothing.
        run: cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2026-0173 --ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0253 --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 --ignore RUSTSEC-2026-0381

  # ── Stage 5: Coverage (on-demand only) ───────────────────────────────────
  # Tarpaulin is the slowest job (~12 min). Running it on every main push
  # would re-add the cost we just trimmed, so it's on-demand: trigger the
  # CI workflow manually (workflow_dispatch) when you want a fresh coverage
  # report. PRs and pushes still get full test coverage via the `test` job;
  # this job only publishes the percentage report.
  coverage:
    name: Code Coverage
    needs: [lint, audit]
    if: github.event_name == 'workflow_dispatch'
    # On the Mac, where tarpaulin finishes the whole suite in ~15 min. A
    # hosted runner needed well over 30 for the same work and cost minutes
    # for it, which is not a trade worth making for a metric job.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Refuse to administer the host's rustup
        # dtolnay/rust-toolchain manages rustup on whatever machine it runs
        # on, and defaults CARGO_HOME to ~/.cargo when it is unset. On a
        # self-hosted runner that is somebody's workstation, so CI installs
        # toolchains into their installation: it removed the rustup binary
        # itself once, leaving every shim in ~/.cargo/bin dangling and no
        # working cargo for the machine owner (#1162).
        #
        # The runner sets CARGO_HOME and RUSTUP_HOME to its own directories.
        # This fails the job if that ever stops being true, rather than
        # letting the damage be discovered at the owner's next build.
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          for var in CARGO_HOME RUSTUP_HOME; do
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::error::$var is unset, so rustup would manage the host's own installation. Set it in the runner service environment."
              exit 1
            fi
            case "$value" in
              "$HOME/.cargo"|"$HOME/.rustup")
                echo "::error::$var points at the host's own installation ($value). CI must not administer it."
                exit 1
                ;;
            esac
            echo "$var=$value"
          done

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1

      - name: Install ALSA dev
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev

      - name: Install tarpaulin
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --locked --out Xml --no-default-features --features "telegram,whatsapp,discord,slack,trello"
        # Note: local-stt excluded — tarpaulin uses rust-lld which can't handle
        # duplicate ggml symbols from whisper-rs-sys + llama-cpp-sys-2.
        # local-tts added when feature lands on main.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./cobertura.xml

  # ── Required gate ────────────────────────────────────────────────────────
  # Single status check for branch protection. Internal job structure
  # can change without touching branch protection settings.
  # Coverage is intentionally excluded — it's main-only.
  ci-gate:
    name: CI Required Gate
    if: always()
    # windows-build is deliberately NOT in the required set. Windows runners
    # bill at 2x and this one measured 51m09s cold, so at ~160 PR runs a
    # fortnight that is ~136h against the 3 Windows builds release.yml
    # actually ran in the same window. #627 removed the original job from the
    # gate for exactly that reason. It stays as an advisory signal; Windows
    # remains release-blocking via release.yml's build matrix before any tag.
    # The Linux test leg IS in the required set: a standard Ubuntu runner, and
    # the only thing that finds a Linux-only break before a user does (#2216).
    # windows-footguns IS in the required set, which is not in tension with
    # the paragraph above: same class of finding (Windows-specific) at a
    # python-pass cost, so blocking on it buys certainty for seconds.
    needs: [lint, build, test, test-linux, audit, windows-footguns]
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi