name: Pre-release Build

# Build downloadable binaries on demand so contributors can test unreleased
# code without waiting for a tagged release.
#
# Deliberately NOT on every push to main. Five targets per commit, on a repo
# that lands many, spends build time continuously to produce artifacts nobody
# asked for. This runs when there is something worth handing out.
#
# macOS targets use the self-hosted Mac Studio runner (fast, native).
# Linux/Windows targets stay on GitHub-hosted runners.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "What is in this build (shown in the pre-release body)"
        required: false
        default: ""

permissions:
  contents: write

# One dispatch at a time. Two runs publishing to the same rolling tag used to
# delete each other's release mid-flight; a second dispatch now waits instead.
# cancel-in-progress is false on purpose: a running build is expensive and a
# newer commit does not make its artifacts wrong.
concurrency:
  group: prerelease-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # macOS — self-hosted Mac Studio runner (native arm64, Rosetta for x86_64)
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (${{ matrix.asset_suffix }})
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_suffix: macos-arm64
          - target: x86_64-apple-darwin
            asset_suffix: macos-amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Build
        env:
          CFLAGS: ${{ matrix.target == 'aarch64-apple-darwin' && '-march=armv8-a+crypto' || '' }}
          CXXFLAGS: ${{ matrix.target == 'aarch64-apple-darwin' && '-march=armv8-a+crypto' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }} --all-features

      - name: Download RTK
        shell: bash
        run: |
          RTK_VERSION="0.40.0"
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) RTK_ASSET="rtk-x86_64-apple-darwin.tar.gz" ;;
            aarch64-apple-darwin) RTK_ASSET="rtk-aarch64-apple-darwin.tar.gz" ;;
          esac
          curl -sL "https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/${RTK_ASSET}" -o "/tmp/${RTK_ASSET}"
          mkdir -p /tmp/rtk-extract && tar xzf "/tmp/${RTK_ASSET}" -C /tmp/rtk-extract
          RTK_BIN=$(find /tmp/rtk-extract -name "rtk" | head -1)
          cp "$RTK_BIN" "target/${{ matrix.target }}/release/"
          chmod +x "target/${{ matrix.target }}/release/rtk"

      # Both surfaces ship from here on: the TUI (`opencrabs`) and the desktop
      # client (`opencrabs-gui`). `--all-features` has always compiled the GUI
      # on every target; the archive step named one file, so the second binary
      # was built and then thrown away. Stripping only the TUI was the visible
      # half of the same omission.
      - name: Strip
        shell: bash
        run: |
          for b in opencrabs opencrabs-gui; do
            strip "target/${{ matrix.target }}/release/$b"
          done

      - name: Create archive
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ARCHIVE="opencrabs-v${VERSION}-pre-${SHA}-${{ matrix.asset_suffix }}"
          cd target/${{ matrix.target }}/release
          # A missing binary used to produce a smaller archive and no error.
          # The GUI was lost exactly that way on every target.
          for b in opencrabs opencrabs-gui rtk; do
            if [ ! -f "$b" ]; then
              echo "::error::$b was not built; refusing to publish a partial archive"
              exit 1
            fi
          done
          tar czf "../../../${ARCHIVE}.tar.gz" opencrabs opencrabs-gui rtk

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prerelease-${{ matrix.asset_suffix }}
          path: opencrabs-v*-pre-*.tar.gz

  # ---------------------------------------------------------------------------
  # Linux — GitHub-hosted runners (cross-compile from Mac is fragile for glibc)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (${{ matrix.asset_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, never ubuntu-latest. The label rolls forward on its own
          # schedule and takes the glibc floor with it: it moved to Ubuntu
          # 26.04 (glibc 2.43) between v0.5.12 and v0.5.13, and the amd64 asset
          # built after the roll refuses to start on Ubuntu 24.04 and older
          # with "version `GLIBC_2.43' not found" (#2206). The arm64 entry below
          # is pinned for the same reason. Both stay on the oldest image we
          # support.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64
            # Thin LTO on this target only, for the reason release.yml gives:
            # the fat-LTO link of the whole binary takes one rustc past 14.8 GB
            # RSS on the hosted arm runner (16 GB, no real swap), the VM
            # freezes, and GitHub kills it with exit 143 after 25 to 30 silent
            # minutes. Run 41604279570 died exactly there. The amd64 runner
            # squeaks through the same link, so it keeps the Cargo.toml profile.
            release_lto: thin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install dependencies
        # libxcb1-dev: #2765 gave Linux gpui's x11 backend, and x11rb's
        # xcb_ffi carries `#[link(name = "xcb")]`. The same link line also
        # carries -lxkbcommon and -lxkbcommon-x11, so those dev packages
        # are needed too; the ubuntu-24.04 image ships none of them.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Build
        shell: bash
        env:
          # Explicit `fat` everywhere else: it is the Cargo.toml value, and an
          # empty string here would be parsed as an invalid lto setting.
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.release_lto || 'fat' }}
        run: cargo build --locked --release --target ${{ matrix.target }} --all-features

      - name: Download RTK
        shell: bash
        run: |
          RTK_VERSION="0.40.0"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) RTK_ASSET="rtk-x86_64-unknown-linux-musl.tar.gz" ;;
            aarch64-unknown-linux-gnu) RTK_ASSET="rtk-aarch64-unknown-linux-gnu.tar.gz" ;;
          esac
          curl -sL "https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/${RTK_ASSET}" -o "/tmp/${RTK_ASSET}"
          mkdir -p /tmp/rtk-extract && tar xzf "/tmp/${RTK_ASSET}" -C /tmp/rtk-extract
          RTK_BIN=$(find /tmp/rtk-extract -name "rtk" | head -1)
          cp "$RTK_BIN" "target/${{ matrix.target }}/release/"
          chmod +x "target/${{ matrix.target }}/release/rtk"

      # Both surfaces ship from here on: the TUI (`opencrabs`) and the desktop
      # client (`opencrabs-gui`). `--all-features` has always compiled the GUI
      # on every target; the archive step named one file, so the second binary
      # was built and then thrown away. Stripping only the TUI was the visible
      # half of the same omission.
      - name: Strip
        shell: bash
        run: |
          for b in opencrabs opencrabs-gui; do
            strip "target/${{ matrix.target }}/release/$b"
          done

      # Same gate as the release workflow: assert the stripped artifact needs no
      # newer glibc than we promise, then prove it starts. A prerelease asset
      # that cannot run is as broken as a release one, and it reaches users
      # through the same download path (#2209).
      - name: Check glibc floor
        shell: bash
        env:
          # The oldest glibc we support, matching ubuntu-24.04 and v0.5.12.
          GLIBC_FLOOR: "2.39"
        run: |
          binary="target/${{ matrix.target }}/release/opencrabs"
          ./scripts/check-glibc-floor.sh "$binary" "$GLIBC_FLOOR"
          "$binary" --version

      - name: Create archive
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ARCHIVE="opencrabs-v${VERSION}-pre-${SHA}-${{ matrix.asset_suffix }}"
          # A Linux desktop needs a menu entry and an icon next to the binary,
          # or a file manager shows the generic exec glyph. Same two files the
          # release workflow ships, copied before the cd below.
          cp packaging/linux/opencrabs.desktop packaging/linux/opencrabs.png \
            "target/${{ matrix.target }}/release/"
          cd target/${{ matrix.target }}/release
          # A missing binary used to produce a smaller archive and no error.
          # The GUI was lost exactly that way on every target.
          for b in opencrabs opencrabs-gui rtk opencrabs.desktop opencrabs.png; do
            if [ ! -f "$b" ]; then
              echo "::error::$b was not built; refusing to publish a partial archive"
              exit 1
            fi
          done
          tar czf "../../../${ARCHIVE}.tar.gz" opencrabs opencrabs-gui rtk \
            opencrabs.desktop opencrabs.png

      # Same gate as the release workflow: the floor check above reads what the
      # binary asks for, this runs it on the distribution that floor names, out
      # of the archive about to be uploaded. A prerelease asset that cannot
      # start reaches users through the same download path as a release one
      # (#2209, #2214).
      - name: Check the archive starts on the oldest supported Linux
        shell: bash
        env:
          # Same floor as the check above; the script maps it to an image.
          GLIBC_FLOOR: "2.39"
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          archive="opencrabs-v${VERSION}-pre-${SHA}-${{ matrix.asset_suffix }}.tar.gz"
          ./scripts/check-linux-asset-starts.sh "$archive" "$GLIBC_FLOOR"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prerelease-${{ matrix.asset_suffix }}
          path: opencrabs-v*-pre-*.tar.gz

  # ---------------------------------------------------------------------------
  # Windows — GitHub-hosted runner (needs NASM + CMake for aws-lc-rs)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (windows-amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      # Pinned to a released tag and an explicit tool version: the action
      # defaults cmakeVersion to "latest" and resolves it at run time.
      - name: Install CMake
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.4"

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Build
        shell: bash
        env:
          AWS_LC_SYS_CMAKE_BUILDER: 1
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --all-features

      - name: Download RTK
        shell: bash
        run: |
          RTK_VERSION="0.40.0"
          RTK_ASSET="rtk-x86_64-pc-windows-msvc.zip"
          curl -sL "https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/${RTK_ASSET}" -o "/tmp/${RTK_ASSET}"
          mkdir -p /tmp/rtk-extract
          unzip -q "/tmp/${RTK_ASSET}" -d /tmp/rtk-extract
          RTK_BIN=$(find /tmp/rtk-extract -name "rtk.exe" | head -1)
          cp "$RTK_BIN" "target/x86_64-pc-windows-msvc/release/"

      # App-local deployment of the MSVC runtime (#2257). The v0.5.15 exe
      # imported VCRUNTIME140.dll, VCRUNTIME140_1.dll, MSVCP140.dll and
      # VCOMP140.DLL and died before printing a line on any Windows without the
      # vc_redist, which is most of them. A static CRT cannot fix it: llama.cpp
      # ignores CMAKE_MSVC_RUNTIME_LIBRARY and rtk.exe is a prebuilt we cannot
      # rebuild, so the four DLLs ride beside both exes instead.
      - name: Stage the MSVC runtime (Windows)
        shell: bash
        run: |
          ./scripts/stage-windows-runtime.sh --self-test
          ./scripts/stage-windows-runtime.sh "target/x86_64-pc-windows-msvc/release"

      - name: Create archive
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ARCHIVE="opencrabs-v${VERSION}-pre-${SHA}-windows-amd64"
          cd target/x86_64-pc-windows-msvc/release
          for b in opencrabs.exe opencrabs-gui.exe rtk.exe; do
            if [ ! -f "$b" ]; then
              echo "::error::$b was not built; refusing to publish a partial archive"
              exit 1
            fi
          done
          for d in msvcp140.dll vcruntime140.dll vcruntime140_1.dll vcomp140.dll; do
            if [ ! -f "$d" ]; then
              echo "::error::$d was not staged; the archive would not start on a clean Windows"
              exit 1
            fi
          done
          7z a "../../../${ARCHIVE}.zip" opencrabs.exe opencrabs-gui.exe rtk.exe \
            msvcp140.dll vcruntime140.dll vcruntime140_1.dll vcomp140.dll

      # Same gate as the release workflow (#2257): the runner has the vc_redist
      # pre-installed, so "the exe starts here" proves nothing. The import table
      # is the signal, and an import passes only when the DLL that satisfies it
      # travels in the archive. rtk.exe and opencrabs-gui.exe are scanned too.
      - name: Check the Windows archive carries every DLL it imports
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          archive="opencrabs-v${VERSION}-pre-${SHA}-windows-amd64.zip"
          python scripts/check-pe-imports.py --self-test
          python scripts/check-pe-imports.py "$archive"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prerelease-windows-amd64
          path: opencrabs-v*-pre-*.zip

  # ---------------------------------------------------------------------------
  # Collect all pre-release artifacts into a single downloadable package
  # ---------------------------------------------------------------------------
  publish-prerelease:
    name: Publish Pre-release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      # Needed before the notes step reads Cargo.toml for the version. Without
      # it that grep runs in an empty workspace and fails the job.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          cd release-assets && sha256sum -- * > SHA256SUMS
          ls -la

      - name: Generate pre-release notes
        id: notes
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          cat > /tmp/prerelease_notes.md << EOF
          ## Pre-release build — v${VERSION}-pre-${SHORT_SHA}

          **On-demand build.** Not a tagged release — for testing only.

          **Commit:** \`${SHORT_SHA}\` on \`${{ github.ref_name }}\` ([view](https://github.com/${{ github.repository }}/commit/${SHA}))

          ${{ inputs.note }}

          ### What's included
          - 5 platforms, each archive carrying BOTH binaries:
            - \`opencrabs\`: the terminal client (TUI)
            - \`opencrabs-gui\`: the desktop client
          - SHA256 checksums
          - RTK 0.40.0 bundled

          ### Install
          Download the archive for your platform, extract, then run \`./opencrabs\` for the
          terminal client or \`./opencrabs-gui\` for the desktop client.

          The desktop client is untested on Linux and Windows: it compiles there,
          nobody has launched it yet. The terminal client is the surface that has
          shipped and is the one to trust if the window misbehaves. The Linux GUI
          needs a display server; the TUI needs none.

          ### Auto-update
          These builds are not available via \`/evolve\` (that pulls tagged releases). To install a pre-release binary manually, download and replace your existing binary.
          EOF

      - name: Update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use a rolling 'nightly' tag: it always points at the latest build.
          #
          # Create once, then upload over the top. The old sequence deleted the
          # release and recreated it, so any failure between those two commands
          # left the community with no download at all, and two dispatches could
          # delete each other's assets. Neither can happen now: the release is
          # only created when it is missing, and every asset is clobbered in
          # place, which also keeps a platform that failed to rebuild serving
          # its previous archive instead of vanishing.
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Pre-release (nightly)" \
              --notes-file /tmp/prerelease_notes.md \
              --prerelease
          else
            gh release create nightly \
              --title "Pre-release (nightly)" \
              --notes-file /tmp/prerelease_notes.md \
              --prerelease \
              --target "${{ github.sha }}"
          fi
          gh release upload --clobber nightly release-assets/*

          # Upload first, prune second. Asset names carry the version and short
          # SHA, so a new build does not overwrite the previous one: without
          # this loop the release accumulates a stale archive set on every run,
          # and a tester downloading from it gets a build from months ago.
          # Pruning after a successful upload means a failure still leaves the
          # previous set in place instead of an empty release.
          keep="$(cd release-assets && ls)"
          for asset in $(gh release view nightly --json assets --jq '.assets[].name'); do
            if ! printf '%s\n' "$keep" | grep -qxF "$asset"; then
              echo "pruning stale asset: $asset"
              gh release delete-asset nightly "$asset" --yes
            fi
          done
